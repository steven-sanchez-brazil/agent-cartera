apiVersion: v1
kind: Secret
metadata:
  name: cartera-strands-agent-secret
  labels:
    app: cartera-strands-agent
type: Opaque
# IMPORTANTE: Los valores deben estar codificados en base64.
# Ejemplo:
#   echo -n "AKIAIOSFODNN7EXAMPLE" | base64
#
# NO almacenes credenciales reales en este archivo.
# Usa herramientas como Sealed Secrets, AWS Secrets Manager o Vault
# para gestión segura de secretos en producción.
stringData:
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
